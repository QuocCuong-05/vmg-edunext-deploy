name: edunext-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./repo
      dockerfile: deploy/staging/backend.Dockerfile
    container_name: edunext-staging-backend
    restart: unless-stopped
    logging: *default-logging
    # Backend gọi Supabase qua domain của chính nó → trỏ thẳng về host (Caddy),
    # miễn nhiễm khi DNS công khai của VPS chập chờn
    extra_hosts:
      - "staging.edunext.vmgenglish.edu.vn:host-gateway"
    env_file: ./backend.env
    networks:
      - app
      - supabase

  frontend:
    build:
      context: ./repo
      dockerfile: deploy/staging/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://staging.edunext.vmgenglish.edu.vn}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-https://staging.edunext.vmgenglish.edu.vn/api}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    container_name: edunext-staging-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-staging.edunext.vmgenglish.edu.vn}
    depends_on:
      - backend
    # 80/443 do Caddy dùng chung (edunext-edge) giữ; container này chỉ phục vụ nội bộ
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
      - supabase
      - edge

networks:
  app:
  supabase:
    external: true
    name: supabase-staging_default
  edge:
    external: true
    name: edunext-edge

volumes:
  caddy_data:
  caddy_config:
